# R2 UC1 main run (TEST_PLAN B5): all 164 HumanEval+, 378 MBPP+, 95 LiveCodeBench v6
# (easy+medium, pre-cutoff) x 5 repeats x 13 arms = 41,405 calls.
# DO NOT RUN before the R1 pilot is reviewed and BUDGET_ESTIMATE is recalibrated (§8).
# budget_usd covers Mercury at its billed promo price too, although the free credit pays it.
name: r2-uc1-main
description: UC1 main - full HumanEval+, MBPP+, LiveCodeBench v6 easy+medium, 5 repeats
seed: 2
repeats: 5
budget_usd: 80.0
max_concurrency_per_provider: 8
warmup_calls_per_arm: 1
network_probe_interval_s: 900
workload:
  kind: codegen
  prompt_version: uc1-v1
  sources:
    - {dataset: humaneval+}
    - {dataset: mbpp+}
    - {dataset: lcb-v6}

# --- arms (identical across R1 and R2; PRD R1-R3) ----------------------------------
# One output budget for every arm (PRD R1). Temperature 0.5 where the provider accepts it
# (PRD R2): Claude Haiku 5.5 rejects non-default sampling values (400), and GPT-6 Luna's
# support is untested, so both run at provider default. expected_output_tokens are the
# BUDGET_ESTIMATE §2.2 guesses (visible + reasoning, weighted by the R2 EvalPlus/LCB mix), used only for dry-run cost.
arms:
  - {name: instant, model: mercury-3, reasoning_effort: instant, temperature: 0.5, max_completion_tokens: 32768, expected_output_tokens: 290}
  - {name: low, model: mercury-3, reasoning_effort: low, temperature: 0.5, max_completion_tokens: 32768, expected_output_tokens: 770}
  - {name: medium, model: mercury-3, reasoning_effort: medium, temperature: 0.5, max_completion_tokens: 32768, expected_output_tokens: 2050}
  - {name: high, model: mercury-3, reasoning_effort: high, temperature: 0.5, max_completion_tokens: 32768, expected_output_tokens: 4630}
  - {name: low, model: mercury-2.5, reasoning_effort: low, temperature: 0.5, max_completion_tokens: 32768, expected_output_tokens: 770}
  - {name: medium, model: mercury-2.5, reasoning_effort: medium, temperature: 0.5, max_completion_tokens: 32768, expected_output_tokens: 2050}
  - {name: thinking-off, model: claude-haiku-5-5, reasoning_effort: low, max_completion_tokens: 32768, expected_output_tokens: 290, provider_extras: {thinking: {type: disabled}}}
  - {name: medium, model: claude-haiku-5-5, reasoning_effort: medium, max_completion_tokens: 32768, expected_output_tokens: 2050}
  - {name: none, model: gpt-6-luna, reasoning_effort: none, max_completion_tokens: 32768, expected_output_tokens: 290}
  - {name: medium, model: gpt-6-luna, reasoning_effort: medium, max_completion_tokens: 32768, expected_output_tokens: 2050}
  - {name: minimal, model: gemini-3.5-flash-lite, reasoning_effort: minimal, temperature: 0.5, max_completion_tokens: 32768, expected_output_tokens: 290}
  - {name: low, model: gpt-oss-120b-cerebras, reasoning_effort: low, temperature: 0.5, max_completion_tokens: 32768, expected_output_tokens: 770}
  - {name: medium, model: gpt-oss-120b-cerebras, reasoning_effort: medium, temperature: 0.5, max_completion_tokens: 32768, expected_output_tokens: 2050}
