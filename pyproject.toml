[project]
name = "dllm-eval"
version = "0.0.1"
description = "Benchmark harness: Inception Mercury 3 (diffusion LLM) vs. autoregressive LLMs"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.17.0",
    "openai>=3.35.1",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
dllm-eval = "dllm_eval.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dllm_eval"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
exclude = ["*.md"]  # doc sketches are intentionally compact

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT"]

[tool.ruff.lint.per-file-ignores]
# Tests carry wide fixture tables and compound assertions on purpose.
"tests/**" = ["E501", "PT018"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live'"
markers = [
    "live: calls real provider APIs and spends tokens; run only with explicit approval",
]
